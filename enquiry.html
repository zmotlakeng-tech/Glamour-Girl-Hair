<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enquiry | Glamour Girl Hair</title>
    <meta name="description" content="Ask about bundle lengths, colours, pricing, or book a professional install.">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <div class="logo">Glamour Girl Hair</div>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="products.html">Products</a></li>
                <li><a href="enquiry.html">Enquiry</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h1>Make an Enquiry</h1>
        <p>Have a question about a bundle, or stock? Fill in the form below and we'll get back to you.</p>

        <form action="#" method="post" class="enquiry-form">
        <p>
            <label for="name">Name</label>
            <input type="text" id="name" name="name" required>
        </p>

        <p>
            <label for="surname">Surname</label>
            <input type="text" id="surname" surname="surname" required>
        </p>

        <p>
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required>
        </p>

        <p>
            <label for="phone">Phone Number</label>
            <input type="tel" id="phone" name="phone">
        </p>

        <p>
            <label for="interest">What are you interested in?</label>
            <select id="interest" name="interest">
                <option value="bundles">Bundles</option>
                <option value="premium quality">Premium Quality</option>
                <option value="affordable quality">Affordable Quality</option>
                <option value="inches">Inches</option>
            </select>
        </p>

        <p>
            <label for="message">Your Message</label>
            <textarea id="message" name="message" rows="5" required></textarea>
        </p>

        <p>
            <button type="submit">Send Enquiry</button>
        </p>
        </form>
    </main>

    <a href="https://wa.me/+27 76 151 0610" class="whatsapp-float" aria-label="Chat with us on WhatsApp">
        WhatsApp Us
    </a>

    <footer>
        <p>&copy; 2026 Glamour Girl Hair. All rights reserved.</p>
    </footer>

</body>
</html>
